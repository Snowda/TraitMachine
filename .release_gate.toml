# release_gate in-repo control overlay. Layered on top of the built-in fleet defaults
# (release_gate/src/defaults.rs). Comment-ratio and file-length ship fleet-wide as
# `advisory` (never block); this repo promotes them to `blocker` (cyclomatic already is one). Each control below reuses
# the default's id + check verbatim and only raises `gate`, so it overrides — not duplicates —
# the default result for the run (results are keyed by (run, control_id), last write wins).
project = "TraitMachine"
schema  = 1

[[control]]
id        = "TraitMachine::default.comment-ratio"
title     = "No source file over the 10% comment-line cap"
assertion = "Repo override: promoted from the fleet advisory default to a blocker."
theme     = "maintainability"
gate      = "blocker"
severity  = "low"
[control.check]
kind      = "complexity"
metric    = "comment_ratio"
scope     = "file_worst"
files     = ["src", "crates"]
predicate = "<= 0.10"

[[control]]
id        = "TraitMachine::default.file-length"
title     = "No source file over 800 lines"
assertion = "Repo override: promoted from the fleet advisory default to a blocker."
theme     = "maintainability"
gate      = "blocker"
severity  = "low"
[control.check]
kind      = "complexity"
metric    = "loc"
scope     = "file_worst"
files     = ["src", "crates"]
predicate = "<= 800"

[[control]]
id        = "TraitMachine::default.pulumi"
title     = "No Pulumi infrastructure in this repo"
assertion = "Repo override: TraitMachine carries no infrastructure, so the Pulumi presence check is off."
theme     = "other"
gate      = "advisory"
severity  = "low"
[control.check]
kind      = "pulumi"
policy    = "off"

[[control]]
id        = "TraitMachine::default.openapi"
title     = "No OpenAPI spec in this repo"
assertion = "Repo override: TraitMachine exposes no HTTP API, so the OpenAPI presence check is off."
theme     = "other"
gate      = "advisory"
severity  = "low"
[control.check]
kind      = "openapi"
policy    = "off"

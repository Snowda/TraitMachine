[package]

name = "traitmachine"
version = "0.0.1"
authors = ["Conor Forde"]
rust-version = "1.96.0"
edition = '2024'
default-run = "traitmachine"
repository = "https://www.github.com/Snowda/TraitMachine"

description = "Trait Machine POC"
keywords = ["traits"]

[[bin]]
name = "traitmachine"
path = "src/main.rs"

[dependencies]

# Async communication
tokio = { version = "1.53.1", features = ["full"] }

# Randomisation
rand = "0.10.2"

# Matrix operations
ndarray = "0.17.2"

# Tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Financial safety — no floats in calculations
float_arithmetic = "deny"
float_cmp = "deny"
float_cmp_const = "deny"

# No panicking in app code
unwrap_used = "deny"
expect_used = "warn"

# Import hygiene
wildcard_imports = "deny"

# Numeric cast safety
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_lossless = "warn"
as_conversions = "warn"

# Ownership / borrowing
clone_on_copy = "warn"
redundant_clone = "warn"
needless_pass_by_value = "warn"
ptr_arg = "warn"

# Allocation
box_collection = "warn"
redundant_allocation = "warn"

# Style preferences
needless_return = "allow"       # conflicts with project explicit-return style
must_use_candidate = "warn"
str_to_string = "warn"

# Iterator preference
manual_filter_map = "warn"
manual_find_map = "warn"

# Panic-macro and stray-stdio bans (CLI bins re-opt-in with a scoped #[allow]).
unreachable = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Complexity / maintainability signals.
too_many_lines = "warn"
excessive_nesting = "warn"
missing_const_for_fn = "warn"
too_long_first_doc_paragraph = "warn"

[profile.coverage]
inherits = "dev"
opt-level = 0
debug = false

[profile.coverage.package."*"]
opt-level = 0
debug = false
